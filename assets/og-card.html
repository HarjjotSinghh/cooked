<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>cooked</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    background: #0a0a0a; color: #f5f5f5;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 56px 64px;
  }
  .tag { color: #a3a3a3; font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase; }
  h1 { font-size: 72px; line-height: 1.05; font-weight: 700; margin-top: 24px; max-width: 1000px; }
  h1 span { color: #f97316; }
  .sub { margin-top: 28px; font-size: 24px; color: #d4d4d4; max-width: 900px; line-height: 1.4; }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; font-size: 20px; color: #a3a3a3; }
  .cmd { color: #fafafa; background: #171717; border: 1px solid #262626; padding: 14px 18px; border-radius: 10px; }
  .verdicts { display: flex; gap: 16px; margin-top: 32px; }
  .v { border: 1px solid #262626; border-radius: 10px; padding: 12px 16px; font-size: 16px; }
  .v.ok { border-color: #166534; color: #4ade80; }
  .v.mid { border-color: #854d0e; color: #facc15; }
  .v.bad { border-color: #991b1b; color: #f87171; }
</style>
</head>
<body>
  <div>
    <div class="tag">agent skill · /cooked</div>
    <h1>Did you <span>cook</span>, still cooking, or are you <span>cooked</span>?</h1>
    <p class="sub">Evidence-only post-work audit. File:line or silence. One next move — not a backlog.</p>
    <div class="verdicts">
      <div class="v ok">You cooked.</div>
      <div class="v mid">Still cooking.</div>
      <div class="v bad">You're cooked.</div>
    </div>
  </div>
  <div class="foot">
    <div class="cmd">npx skills add HarjjotSinghh/cooked --skill cooked -g</div>
    <div>github.com/HarjjotSinghh/cooked</div>
  </div>
</body>
</html>
