<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: Inter, -apple-system, system-ui, sans-serif;
    background: #fafafa;
    /* diagonal hatch */
    background-image: repeating-linear-gradient(
      -45deg, transparent, transparent 10px, rgba(0,0,0,0.035) 10px, rgba(0,0,0,0.035) 11px
    );
    display: flex; align-items: center; justify-content: center;
    color: #0a0a0a;
  }
  .sheet {
    width: 1040px; height: 500px; background: #fff;
    border: 1.5px solid #e5e5e5;
    position: relative;
    padding: 56px 64px;
    display: flex; flex-direction: column;
    box-shadow: 0 1px 0 rgba(0,0,0,0.02);
  }
  .corner { position: absolute; width: 28px; height: 28px; }
  .corner::before, .corner::after { content: ''; position: absolute; background: rgba(10,10,10,0.45); }
  .corner.tl { top: 0; left: 0; }
  .corner.tr { top: 0; right: 0; }
  .corner.bl { bottom: 0; left: 0; }
  .corner.br { bottom: 0; right: 0; }
  .corner.tl::before, .corner.bl::before, .corner.tr::before, .corner.br::before { width: 2px; height: 28px; }
  .corner.tl::after, .corner.bl::after, .corner.tr::after, .corner.br::after { height: 2px; width: 28px; }
  .corner.tl::before, .corner.tl::after { top: 0; left: 0; }
  .corner.tr::before { top: 0; right: 0; }
  .corner.tr::after { top: 0; right: 0; }
  .corner.bl::before { bottom: 0; left: 0; }
  .corner.bl::after { bottom: 0; left: 0; }
  .corner.br::before { bottom: 0; right: 0; }
  .corner.br::after { bottom: 0; right: 0; }

  .brand {
    display: flex; align-items: center; gap: 16px;
    padding-bottom: 28px; border-bottom: 1px solid #ececec;
  }
  .mark {
    width: 52px; height: 52px; border-radius: 12px; background: #f4f4f4;
    border: 1px solid #e5e5e5;
    display: flex; align-items: center; justify-content: center;
    font-family: "JetBrains Mono", monospace; font-weight: 600; font-size: 22px; color: #0a0a0a;
  }
  .brand-text h2 { font-size: 26px; font-weight: 700; letter-spacing: -0.03em; }
  .brand-text p { font-size: 16px; color: #737373; font-weight: 500; margin-top: 2px; }
  h1 {
    margin-top: 40px; font-size: 48px; font-weight: 700;
    letter-spacing: -0.035em; line-height: 1.12; max-width: 820px;
  }
  .desc { margin-top: 18px; font-size: 20px; color: #525252; font-weight: 500; max-width: 700px; line-height: 1.4; }
  .footer {
    margin-top: auto; display: flex; justify-content: space-between; align-items: center;
  }
  .tags { display: flex; gap: 22px; font-size: 16px; font-weight: 500; color: #737373; }
  .tags span { display: flex; align-items: center; gap: 8px; }
  .status {
    display: flex; align-items: center; gap: 10px;
    font-size: 16px; font-weight: 500; color: #525252;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #f97316; }
</style>
</head>
<body>
  <div class="sheet">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="brand">
      <div class="mark">/c</div>
      <div class="brand-text">
        <h2>cooked</h2>
        <p>Agent skill · open source</p>
      </div>
    </div>
    <h1>Prove the work is actually done.</h1>
    <p class="desc">Run after a feature ships. Every finding needs a citation. One next move — or stop.</p>
    <div class="footer">
      <div class="tags">
        <span>◎ Evidence-only</span>
        <span>◎ Spec delta</span>
        <span>◎ One next move</span>
      </div>
      <div class="status"><span class="dot"></span> npx skills add HarjjotSinghh/cooked</div>
    </div>
  </div>
</body>
</html>
