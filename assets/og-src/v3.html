<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: Inter, -apple-system, system-ui, sans-serif;
    background: #ffffff;
    background-image: repeating-linear-gradient(
      -45deg, transparent, transparent 15px, rgba(0,0,0,0.07) 15px, rgba(0,0,0,0.07) 16px
    );
    display: flex; align-items: center; justify-content: center;
    color: #0a0a0a;
  }
  .sheet {
    width: 980px; height: 520px; background: #ffffff;
    border: 1px solid #e6e6e6;
    position: relative;
    padding: 44px 52px 40px;
    display: flex; flex-direction: column;
  }
  .corner { position: absolute; width: 28px; height: 28px; }
  .corner::before, .corner::after { content: ''; position: absolute; background: rgba(10,10,10,0.48); }
  .corner.tl { top: 0; left: 0; }
  .corner.tr { top: 0; right: 0; }
  .corner.bl { bottom: 0; left: 0; }
  .corner.br { bottom: 0; right: 0; }
  .corner.tl::before, .corner.bl::before, .corner.tr::before, .corner.br::before { width: 2px; height: 28px; }
  .corner.tl::after, .corner.bl::after, .corner.tr::after, .corner.br::after { height: 2px; width: 28px; }
  .corner.tl::before, .corner.tl::after { top: 0; left: 0; }
  .corner.tr::before { top: 0; right: 0; }
  .corner.tr::after { top: 0; right: 0; }
  .corner.bl::before { bottom: 0; left: 0; }
  .corner.bl::after { bottom: 0; left: 0; }
  .corner.br::before { bottom: 0; right: 0; }
  .corner.br::after { bottom: 0; right: 0; }

  .brand {
    display: flex; align-items: center; gap: 20px;
  }
  .mark {
    width: 82px; height: 82px; border-radius: 6px; background: #f4f4f4;
    border: 1px solid #e6e6e6;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-family: Inter, -apple-system, system-ui, sans-serif;
    font-size: 28px; font-weight: 600; color: #0a0a0a;
    letter-spacing: -0.04em;
  }
  .brand-text h2 {
    font-family: Manrope, Inter, sans-serif;
    font-size: 42px; font-weight: 600;
    letter-spacing: -0.028em; line-height: 1.15;
  }
  .brand-text p {
    font-family: Inter, sans-serif;
    font-size: 22px; font-weight: 400; color: #767676; line-height: 1.3; margin-top: 4px;
  }
  .divider {
    width: 100%; height: 1px; background: #e6e6e6;
    margin-top: 28px; margin-bottom: 36px;
  }
  h1 {
    font-family: Manrope, Inter, sans-serif;
    font-size: 42px; font-weight: 600;
    letter-spacing: -0.03em; line-height: 1.22;
    max-width: 940px;
  }
  .desc {
    margin-top: 14px;
    font-family: Inter, sans-serif;
    font-size: 22px; font-weight: 400; color: #767676; line-height: 1.4;
    max-width: 860px;
  }
  .footer {
    margin-top: auto;
    display: flex; justify-content: space-between; align-items: center;
    gap: 24px; width: 100%;
  }
  .tags {
    display: flex; align-items: center; gap: 18px; flex-shrink: 0;
  }
  .tag {
    display: flex; align-items: center; gap: 8px;
    font-family: Inter, sans-serif;
    font-size: 20px; font-weight: 500; color: #767676;
  }
  .tag .ico {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .tag .ico svg { display: block; }
  .status {
    display: flex; align-items: center; gap: 10px;
    font-family: Inter, sans-serif;
    font-size: 17px; font-weight: 500; color: #767676;
    flex-shrink: 0;
  }
  .dot {
    width: 9px; height: 9px; border-radius: 50%; background: #f97316;
    box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.18);
  }
</style>
</head>
<body>
  <div class="sheet">
    <div class="corner tl"></div><div class="corner tr"></div>
    <div class="corner bl"></div><div class="corner br"></div>
    <div class="brand">
      <div class="mark" aria-hidden="true">/c</div>
      <div class="brand-text">
        <h2>cooked</h2>
        <p>Agent skill · open source</p>
      </div>
    </div>
    <div class="divider"></div>
    <h1>Prove the work is actually done.</h1>
    <p class="desc">
      Run after a feature ships. Every finding needs a citation.<br>
      One next move — or stop.
    </p>
    <div class="footer">
      <div class="tags">
        <!-- Evidence-only: search / verify -->
        <span class="tag">
          <span class="ico" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <circle cx="11" cy="11" r="6.5" stroke="#767676" stroke-width="1.6"/>
              <path d="M16 16l4.5 4.5" stroke="#767676" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M9 11h4M11 9v4" stroke="#767676" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
          Evidence-only
        </span>
        <!-- Spec delta: document + diff -->
        <span class="tag">
          <span class="ico" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M7 3.5h7l4 4V20a1.5 1.5 0 0 1-1.5 1.5h-9.5A1.5 1.5 0 0 1 5.5 20V5A1.5 1.5 0 0 1 7 3.5z" stroke="#767676" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M14 3.5V8h4.5" stroke="#767676" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M9 13h6M9 16.5h4" stroke="#767676" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
          Spec delta
        </span>
        <!-- One next move: single arrow -->
        <span class="tag">
          <span class="ico" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M5 12h12.5" stroke="#767676" stroke-width="1.6" stroke-linecap="round"/>
              <path d="M13.5 7.5L19 12l-5.5 4.5" stroke="#767676" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          One next move
        </span>
      </div>
      <div class="status"><span class="dot"></span> npx skills add HarjjotSinghh/cooked</div>
    </div>
  </div>
</body>
</html>
